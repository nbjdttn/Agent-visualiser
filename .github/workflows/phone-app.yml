# Publishes the phone app (the same web app, running entirely on the device)
# to GitHub Pages: https://<owner>.github.io/<repo>/
#
# One-time setup: repository Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that every push to main republishes it.
name: Publish phone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Where the app looks for automatic updates (the usage-data branch of this repository).
          VITE_SYNC_REPO: ${{ github.repository }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Pages is set to "Deploy from a branch", GitHub also publishes the raw source on
      # every push. Let that finish first, so this build is the one that stays live.
      - name: Wait for GitHub's own Pages build, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            busy=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length' || echo 0)
            if [ "$busy" = "0" ]; then break; fi
            echo "Waiting for GitHub's branch build to finish..."
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v5
