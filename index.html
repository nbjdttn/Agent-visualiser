<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Your Claude and OpenAI usage: tokens, models and projects by day and month." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
    <!-- Home Screen app on iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Usage" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="./icons/app-icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/app-icon.svg" />
    <title>Agent Visualiser</title>
    <style>
      /* Shown only on a phone turned sideways (see styles.css); hidden even before the app's CSS loads. */
      .rotate-note {
        display: none;
      }
    </style>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('av.theme');
        if (['light', 'dark', 'midnight', 'paper'].indexOf(t) >= 0) document.documentElement.setAttribute('data-theme', t);
        var p = localStorage.getItem('av.palette');
        if (['ocean', 'sunset', 'bold', 'berry'].indexOf(p) >= 0) document.documentElement.setAttribute('data-palette', p);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div class="rotate-note" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
      Turn your phone upright
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // While an update is published, GitHub can briefly serve this page unbuilt
      // (the line above then points at source code). If so, fetch the built page.
      (function () {
        if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
        if (!document.querySelector('script[src="/src/main.tsx"]')) return;
        var tries = 0;
        try {
          tries = Number(sessionStorage.getItem('av.fresh') || 0);
          sessionStorage.setItem('av.fresh', String(tries + 1));
        } catch (e) {}
        if (tries < 20) {
          setTimeout(function () {
            location.replace(location.pathname + '?fresh=' + Date.now() + location.hash);
          }, 2500);
        }
      })();
    </script>
  </body>
</html>
